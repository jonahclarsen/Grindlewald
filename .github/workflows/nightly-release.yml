name: Daily Android release
on:
  schedule:
    - cron: '43 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git fetch origin main --tags
      - id: version
        run: node scripts/nightly-release.mjs
      - if: steps.version.outputs.dispatch == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run android.yml --ref "$RELEASE_TAG"
