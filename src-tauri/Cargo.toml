[package]
name = "grindlewald"
version = "0.1.0"
description = "A fast macOS menu-bar controller for Govee Bluetooth lights"
authors = ["Jonah Clarsen"]
edition = "2024"
license = "MIT"
default-run = "grindlewald"

[lib]
name = "grindlewald_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "grindlewald"
path = "src/main.rs"

[[bin]]
name = "grindlewaldctl"
path = "src/bin/grindlewaldctl.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
btleplug = "0.11.8"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
dirs = "6.0"
fastrand = "2.5"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
uuid = "1.18"

[dev-dependencies]
tempfile = "3.21"
